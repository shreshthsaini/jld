[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "jacobian-lens-distance"
version = "1.1.0"
description = "JLD: a full-reference perceptual image distance read through a Jacobian lens of a frozen ViT"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
    { name = "Shreshth Saini" },
    { name = "Balu Adsumilli" },
    { name = "Alan C. Bovik" },
]
keywords = ["perceptual distance", "image quality assessment", "full-reference metric", "DINOv2"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
    "torch>=2.1",
    "torchvision>=0.16",
    "timm>=1.0",
    "numpy>=1.24",
    "pillow>=10.0",
    "huggingface_hub>=0.20",
]

[project.optional-dependencies]
eval = ["pandas>=2.0", "scipy>=1.10"]
baselines = ["pyiqa>=0.1.13"]
test = ["pytest>=7"]
pyiqa = ["pyiqa>=0.1.16"]
torchmetrics = ["torchmetrics>=1.8"]
demo = ["gradio>=6.29.1,<7", "spaces>=0.51.3"]

[project.entry-points."pyiqa.archs"]
jld = "jld.integrations.pyiqa:register"

[project.urls]
Paper = "https://arxiv.org/abs/2610.05967"
Homepage = "https://shreshthsaini.github.io/jld/"
Repository = "https://github.com/shreshthsaini/jld"
Issues = "https://github.com/shreshthsaini/jld/issues"

[project.scripts]
jld = "jld.cli:main"

[dependency-groups]
dev = ["pytest>=7", "pandas>=2.0", "scipy>=1.10"]

[tool.setuptools.packages.find]
include = ["jld", "jld.*"]

[tool.setuptools.package-data]
jld = ["data/*.npz"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
